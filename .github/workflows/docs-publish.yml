name: Publish documentation

on:
  workflow_run:
    workflows: [Documentation]
    types: [completed]
  # Cleanup only: no PR checkout or execution in this privileged context.
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful Documentation run ID (also approves a fork preview at that exact head)"
        required: true
        type: string

permissions:
  contents: read

# Keep each PR publication/cleanup: the default single pending slot loses events.
concurrency:
  group: docs-pages-publisher
  queue: max

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.prepare.outputs.url }}
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Never execute code from the triggering PR or release.
          ref: main
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.8"
          python-version: "3.13"
          enable-cache: false
      - run: uv sync --locked --group publishing
      - name: Validate artifact and assemble all published versions
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_RUN: ${{ inputs.run_id }}
        run: uv run --no-sync python scripts/publish_docs.py --run-id "$APPROVED_RUN" --pages-dir "$RUNNER_TEMP/docs-pages"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: steps.prepare.outputs.publish == 'true'
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: steps.prepare.outputs.publish == 'true'
        with:
          path: ${{ runner.temp }}/docs-pages
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        if: steps.prepare.outputs.publish == 'true'
        id: deploy
      - name: Update PR preview link after successful deployment
        if: steps.prepare.outputs.publish == 'true' && steps.prepare.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.prepare.outputs.number }}
          PREVIEW_URL: ${{ steps.prepare.outputs.url }}
          SOURCE_SHA: ${{ steps.prepare.outputs.sha }}
          REMOVED: ${{ steps.prepare.outputs.removed }}
        run: |
          args=()
          if [ "$REMOVED" = true ]; then args+=(--removed); fi
          uv run --no-sync python scripts/publish_docs.py --comment "$PR_NUMBER" --url "$PREVIEW_URL" --sha "$SOURCE_SHA" "${args[@]}"
