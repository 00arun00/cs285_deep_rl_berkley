# Called locally so GitHub records the source revision in referenced_workflows.
name: Build documentation artifact

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.8"
          python-version: "3.13"
          enable-cache: false
      - run: uv sync --locked
      - run: uv tool install ruff==0.14.10
      - run: uv run --no-sync python -m unittest discover -s scripts/tests -v
      - run: uv run --no-sync python scripts/build_docs.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-site-${{ github.run_attempt }}
          path: docs-artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
